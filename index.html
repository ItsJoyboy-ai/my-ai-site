<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; display: flex; flex-direction: column; height: 100vh; }
        header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chatContainer { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 15px; word-wrap: break-word; }
        .user-message { background: #007bff; color: white; align-self: flex-end; }
        .bot-message { background: #e9e9eb; color: #333; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        button { margin-left: 8px; padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>My AI Assistant</header>
    <div id="chatContainer"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Replace with your new Google AI Studio API key
        const GEMINI_API_KEY = "YOUR_NEW_API_KEY";

        async function getAIResponse(userPrompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: userPrompt }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "Error generating response. Please check your API key.";
                }
            } catch (error) {
                return "Network error. Please try again.";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const messageText = input.value.trim();

            if (messageText === "") return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = messageText;
            chatContainer.appendChild(userMsg);

            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const botMsg = document.createElement('div');
            botMsg.className = 'message bot-message';
            botMsg.textContent = "Thinking...";
            chatContainer.appendChild(botMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiResponseText = await getAIResponse(messageText);
            botMsg.textContent = aiResponseText;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>

</body>
</html>
